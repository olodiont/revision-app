  <circle cx="41.5" cy="28.5" r="1.9" fill="#d97757"/>
  <circle cx="46.5" cy="28.5" r="1.9" fill="#d97757"/>
  <circle cx="51.5" cy="28.5" r="1.9" fill="#d97757"/>
</svg>
